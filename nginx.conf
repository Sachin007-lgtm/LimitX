worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Round-robin across the two gateway instances.
    # Because both share Redis, the rate limit is global — a client that
    # hits gateway-1 for 60 requests and gateway-2 for 60 requests will
    # be correctly limited after 100 total (not 60+60=120).
    upstream gateway {
        server gateway-1:3000;
        server gateway-2:3001;
    }

    # Pass real client IP through to the gateway
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header Host            $host;

    server {
        listen 80;

        location / {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            # Expose rate-limit headers to clients
            add_header RateLimit-Limit      $upstream_http_ratelimit_limit      always;
            add_header RateLimit-Remaining  $upstream_http_ratelimit_remaining  always;
            add_header RateLimit-Reset      $upstream_http_ratelimit_reset      always;
            add_header X-RateLimit-Algorithm $upstream_http_x_ratelimit_algorithm always;
        }

        location /health {
            proxy_pass http://gateway;
            access_log off;
        }
    }
}
