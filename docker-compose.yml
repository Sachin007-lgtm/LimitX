version: "3.9"

# Topology:
#
#   [client] → nginx:80 → gateway-1:3000 ─┐
#                       → gateway-2:3001 ─┼→ redis:6379
#
# Both gateway instances share the same Redis, so rate limits are
# enforced globally, not per-instance. This is the "distributed" part.

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  # ── Gateway instance 1 ─────────────────────────────────────────────────────
  gateway-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      REDIS_FAIL_STRATEGY: open
      DEFAULT_LIMIT: 100
      DEFAULT_WINDOW_MS: 60000
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    # Expose directly for per-instance testing
    ports:
      - "3000:3000"

  # ── Gateway instance 2 ─────────────────────────────────────────────────────
  gateway-2:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      REDIS_FAIL_STRATEGY: open
      DEFAULT_LIMIT: 100
      DEFAULT_WINDOW_MS: 60000
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  # ── nginx load balancer ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2

volumes:
  redis_data:
